<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AK AIR — Boarding Pass</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, #dbeafe, transparent 35%),
          linear-gradient(135deg, #eef6ff, #dceeff);

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px;
      }

      .page {
        width: 100%;
        max-width: 850px;
      }

      .success {
        text-align: center;
        margin-bottom: 20px;
      }

      .success-icon {
        width: 55px;
        height: 55px;

        margin: auto;

        border-radius: 50%;
        background: #16a34a;
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 28px;
        font-weight: bold;
      }

      .success h2 {
        margin: 10px 0 4px;
        color: #123;
      }

      .success p {
        margin: 0;
        color: #64748b;
      }

      /* BOARDING PASS */

      .boarding-pass {
        display: grid;
        grid-template-columns: 1fr 260px;

        background: white;

        border-radius: 20px;

        overflow: hidden;

        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15);
      }

      /* MAIN SECTION */

      .main {
        padding: 30px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 30px;
      }

      .logo {
        font-size: 28px;
        font-weight: 900;
        color: #0874c9;

        letter-spacing: 1px;
      }

      .boarding-label {
        font-size: 12px;
        font-weight: bold;

        color: #64748b;

        letter-spacing: 1.5px;
      }

      .route {
        display: grid;

        grid-template-columns: 1fr auto 1fr;

        align-items: center;

        text-align: center;

        margin-bottom: 30px;
      }

      .airport {
        font-size: 42px;
        font-weight: 900;

        color: #0f172a;
      }

      .city {
        color: #64748b;
        font-size: 14px;

        margin-top: 4px;
      }

      .plane {
        font-size: 28px;

        color: #0874c9;

        padding: 0 25px;
      }

      .details {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 20px;

        padding: 20px 0;

        border-top: 1px solid #e2e8f0;
        border-bottom: 1px solid #e2e8f0;
      }

      .detail span {
        display: block;

        font-size: 11px;

        color: #94a3b8;

        font-weight: bold;

        letter-spacing: 1px;

        margin-bottom: 6px;
      }

      .detail strong {
        font-size: 16px;

        color: #0f172a;

        word-break: break-word;
      }

      .seat {
        font-size: 24px !important;

        color: #0874c9 !important;
      }

      .passenger {
        margin-top: 25px;
      }

      .passenger-label {
        font-size: 11px;

        color: #94a3b8;

        font-weight: bold;

        letter-spacing: 1px;

        margin-bottom: 6px;
      }

      .passenger-name {
        font-size: 20px;

        font-weight: 800;

        color: #0f172a;

        text-transform: uppercase;
      }

      /* STUB */

      .stub {
        position: relative;

        background: #0874c9;

        color: white;

        padding: 28px 25px;

        display: flex;

        flex-direction: column;

        justify-content: space-between;
      }

      .stub::before {
        content: "";

        position: absolute;

        left: -10px;
        top: 0;
        bottom: 0;

        border-left: 2px dashed #cbd5e1;
      }

      .stub-logo {
        font-size: 23px;

        font-weight: 900;

        letter-spacing: 1px;
      }

      .stub-title {
        margin-top: 25px;

        font-size: 11px;

        letter-spacing: 2px;

        opacity: 0.75;
      }

      .stub-seat {
        font-size: 50px;

        font-weight: 900;

        margin-top: 4px;
      }

      .barcode {
        height: 85px;

        background: repeating-linear-gradient(
          90deg,
          white 0px,
          white 2px,
          transparent 2px,
          transparent 5px,
          white 5px,
          white 6px,
          transparent 6px,
          transparent 9px
        );

        margin-top: 25px;

        border-radius: 3px;
      }

      .barcode-number {
        text-align: center;

        font-family: monospace;

        font-size: 11px;

        margin-top: 8px;

        letter-spacing: 2px;
      }

      .flight-small {
        margin-top: 20px;

        font-size: 12px;

        opacity: 0.8;
      }

      .flight-number {
        font-size: 20px;

        font-weight: bold;

        margin-top: 3px;
      }

      /* BUTTON */

      .actions {
        display: flex;

        justify-content: center;

        gap: 12px;

        margin-top: 25px;
      }

      button {
        border: none;

        padding: 13px 24px;

        border-radius: 10px;

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
      }

      .print {
        background: #0874c9;

        color: white;
      }

      .print:hover {
        background: #075a9f;

        transform: translateY(-1px);
      }

      .home {
        background: white;

        color: #0874c9;

        border: 1px solid #cbd5e1;
      }

      .home:hover {
        background: #f1f5f9;
      }

      /* MOBILE */

      @media (max-width: 700px) {
        body {
          padding: 15px;
        }

        .boarding-pass {
          grid-template-columns: 1fr;
        }

        .stub {
          min-height: 280px;
        }

        .stub::before {
          left: 0;
          right: 0;
          top: -10px;
          bottom: auto;

          border-left: none;
          border-top: 2px dashed #cbd5e1;
        }

        .details {
          grid-template-columns: 1fr 1fr;
        }

        .airport {
          font-size: 32px;
        }

        .plane {
          padding: 0 10px;
        }
      }

      /* PRINT */

      @media print {
        body {
          background: white;
          padding: 0;
        }

        .success,
        .actions {
          display: none;
        }

        .boarding-pass {
          box-shadow: none;

          width: 100%;
          max-width: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <!-- SUCCESS MESSAGE -->

      <div class="success">
        <div class="success-icon">✓</div>

        <h2>Check-in Successful</h2>

        <p>Your AK AIR boarding pass is ready.</p>
      </div>

      <!-- BOARDING PASS -->

      <div class="boarding-pass">
        <!-- MAIN -->

        <div class="main">
          <div class="header">
            <div class="logo">
              <img
                src="airline_logo.png"
                alt="AK AIR Logo"
                width="100"
                height="50"
              />
            </div>

            <div class="boarding-label">BOARDING PASS</div>
          </div>

          <!-- ROUTE -->

          <div class="route">
            <div>
              <div class="airport" id="fromAirport">COK</div>

              <div class="city">Kochi</div>
            </div>

            <div class="plane">✈</div>

            <div>
              <div class="airport" id="toAirport">ALA</div>

              <div class="city">Almaty</div>
            </div>
          </div>

          <!-- FLIGHT DETAILS -->

          <div class="details">
            <div class="detail">
              <span>PASSENGER</span>

              <strong id="passengerName"> — </strong>
            </div>

            <div class="detail">
              <span>FLIGHT</span>

              <strong id="flight"> — </strong>
            </div>

            <div class="detail">
              <span>SEAT</span>

              <strong class="seat" id="seat"> — </strong>
            </div>

            <div class="detail">
              <span>BOOKING REF</span>

              <strong id="pnr"> — </strong>
            </div>

            <div class="detail">
              <span>GATE</span>

              <strong> A12 </strong>
            </div>

            <div class="detail">
              <span>BOARDING</span>

              <strong> 08:25 </strong>
            </div>
          </div>

          <!-- PASSENGER -->

          <div class="passenger">
            <div class="passenger-label">PASSENGER NAME</div>

            <div class="passenger-name" id="passengerNameLarge">—</div>
          </div>
        </div>

        <!-- STUB -->

        <div class="stub">
          <div>
            <div class="stub-logo">AK AIR</div>

            <div class="stub-title">SEAT</div>

            <div class="stub-seat" id="stubSeat">—</div>

            <div class="flight-small">FLIGHT</div>

            <div class="flight-number" id="stubFlight">—</div>
          </div>

          <!-- FAKE BARCODE -->

          <div>
            <div class="barcode"></div>

            <div class="barcode-number" id="barcodeNumber">AK000000</div>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->

      <div class="actions">
        <button class="print" onclick="window.print()">
          🖨 Print Boarding Pass
        </button>

        <button class="home" onclick="window.location.href = 'index.html'">
          Back to AK AIR
        </button>
      </div>
    </div>

    <script>
      /*
      Read information from the URL.

      Example:

      boarding-pass.html?
      pnr=AK1234
      &lastname=Thomas
      &flight=AK AIR 001 - Kochi to Almaty
      &seat=2B
    */

      const params = new URLSearchParams(window.location.search);

      const pnr = params.get("pnr") || "—";

      const lastname = params.get("lastname") || "—";

      const flight = params.get("flight") || "AK AIR 001";

      const seat = params.get("seat") || "—";

      // Passenger

      document.getElementById("passengerName").textContent = lastname;

      document.getElementById("passengerNameLarge").textContent = lastname;

      // Flight

      document.getElementById("flight").textContent = flight;

      document.getElementById("stubFlight").textContent = flight
        .replace("AK AIR ", "")
        .split(" - ")[0];

      // Seat

      document.getElementById("seat").textContent = seat;

      document.getElementById("stubSeat").textContent = seat;

      // PNR

      document.getElementById("pnr").textContent = pnr;

      // Barcode number

      document.getElementById("barcodeNumber").textContent =
        "AK" +
        pnr
          .replace(/[^a-zA-Z0-9]/g, "")
          .toUpperCase()
          .slice(0, 8);
    </script>
  </body>
</html>
