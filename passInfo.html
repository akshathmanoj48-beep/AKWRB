<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --bg: #eef9ff;
        --bg-2: #e2f4ff;
        --card-bg: rgba(255, 255, 255, 0.96);
        --text: #14314b;
        --muted: #557089;
        --primary: #0f8df7;
        --primary-2: #2ad6a6;
        --line: rgba(15, 141, 247, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
        color: var(--text);
      }

      .page-wrap {
        width: min(90%, 500px);
      }

      .title {
        margin: 0 0 20px;
        font-size: clamp(2.1rem, 4vw, 3rem);
        text-align: center;
        letter-spacing: 1px;
        color: #133149;
      }

      .tag {
        display: inline-block;
        margin-bottom: 14px;
        padding: 8px 14px;
        background: rgba(42, 214, 166, 0.12);
        border: 1px solid rgba(42, 214, 166, 0.28);
        border-radius: 999px;
        color: #0d7e5d;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card {
        position: relative;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(135deg, #11d7ff, #1a7dff, #27e7b0) border-box;
        border: 4px solid transparent;
        border-radius: 18px;
        padding: 24px 22px;
        box-shadow: 0 18px 35px rgba(23, 77, 117, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }

      .card-heading {
        margin: 0 0 16px;
        font-size: 1.5rem;
        text-align: center;
        color: #102b3a;
        letter-spacing: 0.04em;
      }

      .info-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      .info-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        background: rgba(236, 247, 255, 0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .value {
        font-weight: 700;
        color: #0d2336;
        text-align: right;
      }

      button {
        margin-top: 16px;
        padding: 12px 20px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(26, 125, 255, 0.18);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          filter 0.2s ease;
      }

      @keyframes rotateBorder {
        0% {
          --angle: 0deg;
        }
        100% {
          --angle: 360deg;
        }
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(39, 231, 176, 0.2);
        filter: brightness(1.44);
      }

      .card > * {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <h1 class="title">FOUND!</h1>
      <div class="card">
        <span class="tag">Confirmed</span>
        <h2 class="card-heading">YOUR INFORMATION</h2>
        <ul class="info-list">
          <li class="info-item">
            <span class="label">PNR</span>
            <span class="value" id="pnr">-</span>
          </li>
          <li class="info-item">
            <span class="label">Last Name</span>
            <span class="value" id="lastname">-</span>
          </li>
          <li class="info-item">
            <span class="label">Flight</span>
            <span class="value" id="flight">-</span>
          </li>
        </ul>
        <button id="checkinBtn">Check IN</button>
      </div>
    </div>
  </body>
  <script>
    const pnrElement = document.getElementById("pnr");
    const lastnameElement = document.getElementById("lastname");
    const flightElement = document.getElementById("flight");

    const params = new URLSearchParams(window.location.search);

    const pnr = params.get("pnr");
    const lastname = params.get("lastname");
    const flight = params.get("flight");

    // Display booking information
    pnrElement.textContent = pnr || "-";
    lastnameElement.textContent = lastname || "-";
    flightElement.textContent = flight || "-";

    // Check-in button
    document
      .getElementById("checkinBtn")
      .addEventListener("click", function () {
        // Available seats
        const seats = ["1A", "1B", "1C", "2A", "2B", "2C", "3A", "3B", "3C"];

        // Automatically assign a seat
        const assignedSeat = seats[Math.floor(Math.random() * seats.length)];

        // Add seat to existing URL parameters
        params.set("seat", assignedSeat);

        // Go to boarding pass
        window.location.href = "boarding-pass.html?" + params.toString();
      });
  </script>
</html>
