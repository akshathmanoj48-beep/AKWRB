<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <style>
      body {
        background: #111;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        font-family: "Poppins", sans-serif;
      }

      .loader {
        border: 6px solid #333;
        border-top: 6px solid cyan;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        animation: spin 1s linear infinite;
        margin-bottom: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <p id="message">Please wait...</p>

    <script>
      const messages = [
        "Connecting tracks...",
        "Switching signals...",
        "Warming up the engines...",
        "Calibrating systems...",
        "Checking passenger list… yes, you’re on board!",
        "Brakes released… accelerating through the network!",
        "Brakes released… accelerating through the network!",
        "Still faster than Indian Railways IRCTC!",
        "Hold tight! The bits are aligning.",
      ];

      // Pick random message
      document.getElementById("message").textContent =
        messages[Math.floor(Math.random() * messages.length)];

      // Get next page from sessionStorage
      const nextPage = sessionStorage.getItem("nextPage");

      // Redirect after delay
      setTimeout(() => {
        if (nextPage) {
          window.location.href = nextPage;
        } else {
          window.location.href = "index.html";
        }
      }, 2000);
    </script>
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-analytics.js";
      // TODO: Add SDKs for Firebase products that you want to use
      // https://firebase.google.com/docs/web/setup#available-libraries

      // Your web app's Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyAkN-BczC0nYZaNReDbQIDhTBw01ErtjLA",
        authDomain: "akshath-80745.firebaseapp.com",
        projectId: "akshath-80745",
        storageBucket: "akshath-80745.firebasestorage.app",
        messagingSenderId: "183756071011",
        appId: "1:183756071011:web:4c6187b8f2e837a0285856",
        measurementId: "G-6YG9JXXSXY",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
    </script>
  </body>
</html>
